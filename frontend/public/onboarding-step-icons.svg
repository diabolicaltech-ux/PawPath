<svg viewBox="0 0 256 64" xmlns="http://www.w3.org/2000/svg">
  <!-- 1. Paw print - Pet info -->
  <g transform="translate(10, 12)">
    <ellipse cx="16" cy="24" rx="8" ry="6" fill="none" stroke="#1A1A2E" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="10" cy="14" r="3" fill="none" stroke="#1A1A2E" stroke-width="2.5"/>
    <circle cx="22" cy="14" r="3" fill="none" stroke="#1A1A2E" stroke-width="2.5"/>
    <circle cx="14" cy="10" r="2.5" fill="none" stroke="#1A1A2E" stroke-width="2.5"/>
    <circle cx="18" cy="10" r="2.5" fill="none" stroke="#1A1A2E" stroke-width="2.5"/>
  </g>
  <!-- 2. Ruler/weight - Measurements -->
  <g transform="translate(52, 12)">
    <rect x="4" y="8" width="4" height="28" rx="1" fill="none" stroke="#1A1A2E" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="8" y="12" width="4" height="24" rx="1" fill="none" stroke="#1A1A2E" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="12" y="16" width="4" height="20" rx="1" fill="none" stroke="#1A1A2E" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="16" y="10" width="4" height="26" rx="1" fill="none" stroke="#1A1A2E" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="20" y="14" width="4" height="22" rx="1" fill="none" stroke="#1A1A2E" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- 3. Calendar - Age/DOB -->
  <g transform="translate(96, 12)">
    <rect x="2" y="8" width="28" height="24" rx="3" fill="none" stroke="#1A1A2E" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="2" y1="16" x2="30" y2="16" stroke="#1A1A2E" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8" y1="4" x2="8" y2="10" stroke="#1A1A2E" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="24" y1="4" x2="24" y2="10" stroke="#1A1A2E" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- 4. Medical cross/stethoscope - Health history -->
  <g transform="translate(140, 12)">
    <circle cx="16" cy="18" r="14" fill="none" stroke="#1A1A2E" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="16" y1="8" x2="16" y2="28" stroke="#1A1A2E" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="6" y1="18" x2="26" y2="18" stroke="#1A1A2E" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- 5. Heart - Lifestyle/Personality -->
  <g transform="translate(184, 12)">
    <path d="M16,30 C4,18 2,10 8,4 C12,0 16,4 16,8 C16,4 20,0 24,4 C30,10 28,18 16,30 Z" fill="none" stroke="#1A1A2E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- 6. Checkmark circle - Complete -->
  <g transform="translate(228, 12)">
    <circle cx="16" cy="16" r="14" fill="none" stroke="#1A1A2E" stroke-width="2.5"/>
    <polyline points="8,16 13,22 24,10" fill="none" stroke="#1A1A2E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>